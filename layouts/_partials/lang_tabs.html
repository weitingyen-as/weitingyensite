{{/* Two-way language switch. Every switch on the page moves together, so a
     reader never ends up with an English hero above a Mandarin bio. */}}
<div class="lang-tabs" role="group" aria-label="Choose a language / 選擇語言">
  <button type="button" class="lang-tab is-on" data-set-lang="en" aria-pressed="true">English</button>
  <button type="button" class="lang-tab" data-set-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
</div>
