{{/* Every page offers a way back up; never rely on the browser's back button. */}}
<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="{{ "" | relURL }}">Home</a>
  {{ with .CurrentSection }}
    {{ if and .Title (ne .RelPermalink $.RelPermalink) }}
      <span aria-hidden="true">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  {{ end }}
  <span aria-hidden="true">/</span><span>{{ .Title }}</span>
</nav>
