baseURL: "https://weitingyen-as.github.io/weitingyensite/"
title: "Wei-Ting Yen"
locale: en-us

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

enableRobotsTXT: true
enableGitInfo: false
summaryLength: 30
timeout: 300s

outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# No taxonomies: this is a single page, so there is nowhere for a term page to
# lead. Tags are still read from front matter to place each paper in a research
# area (see data/research_areas.json).
taxonomies: {}

params:
  # Owner identity — used by the hero, structured data and the footer.
  author: "Wei-Ting Yen"
  short_name: "Wei-Ting Yen"
  institution: "Institute of Political Science, Academia Sinica"
  email: "wyen@as.edu.tw"
  description: "Wei-Ting Yen is a political economist at the Institute of Political Science, Academia Sinica, working on welfare states, economic insecurity, and crisis governance in Asia."

  appearance:
    theme_day: custom
    theme_night: custom
    color_mode: light
    font: native
    font_size: L

  header:
    navbar:
      enable: true
      show_search: true
      show_theme_chooser: false
      show_translations: false
      logo:
        text: "WEI-TING YEN"

  features:
    search:
      provider: flexsearch

  extensions:
    css:
      - css/custom.css

  # Owner choices recorded on the intake form (both boxes left unchecked).
  mysite:
    credit: false
    discovery: false

menu:
  # Single-page site: every entry is an in-page anchor.
  main:
    - name: About
      url: "/#about"
      weight: 10
    - name: Research
      url: "/#research-areas"
      weight: 20
    - name: Public Writing
      url: "/#public-writing"
      weight: 30
    - name: For Students
      url: "/#opportunity"
      weight: 40
    - name: Contact
      url: "/#contact"
      weight: 50
